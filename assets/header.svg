<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none" role="img" aria-label="fhudint — terminal header">
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .fade { opacity: 0; animation: fadeUp 0.5s ease-out forwards; }
    .d1 { animation-delay: 0.15s; }
    .d2 { animation-delay: 0.45s; }
    .d3 { animation-delay: 0.75s; }
    .d4 { animation-delay: 1.0s; }
    .cursor { animation: blink 1.1s steps(1) infinite 1.2s; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.72); } }
    @media (prefers-reduced-motion: reduce) {
      .fade { animation: none; opacity: 1; }
      .cursor, .pulse { animation: none; }
    }
  </style>

  <!-- terminal frame -->
  <rect x="1" y="1" width="1198" height="298" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>

  <!-- faint dot matrix, right side -->
  <defs>
    <pattern id="dots" x="0" y="0" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1E293B"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="298" rx="14"/></clipPath>
  </defs>
  <rect x="760" y="48" width="440" height="252" fill="url(#dots)" clip-path="url(#frame)"/>

  <!-- window bar -->
  <line x1="1" y1="48" x2="1199" y2="48" stroke="#1E293B" stroke-width="2"/>
  <circle cx="30" cy="25" r="6" fill="#334155"/>
  <circle cx="54" cy="25" r="6" fill="#334155"/>
  <circle cx="78" cy="25" r="6" fill="#22C55E"/>
  <text x="104" y="30" class="mono" font-size="14" fill="#64748B">fhudint@fedora: ~</text>

  <!-- status, top right -->
  <g class="fade d4">
    <circle cx="1046" cy="25" r="5" fill="#22C55E" class="pulse"/>
    <text x="1060" y="30" class="mono" font-size="14" fill="#94A3B8">building</text>
  </g>

  <!-- prompt -->
  <g class="fade d1">
    <text x="48" y="118" class="mono" font-size="20">
      <tspan fill="#22C55E">$</tspan>
      <tspan fill="#94A3B8" dx="8">whoami</tspan>
    </text>
  </g>

  <!-- name -->
  <g class="fade d2">
    <text x="46" y="196" class="mono" font-size="64" font-weight="700" fill="#F8FAFC" letter-spacing="-2">fhudint</text>
    <rect x="330" y="146" width="30" height="56" fill="#22C55E" class="cursor"/>
  </g>

  <!-- tagline -->
  <g class="fade d3">
    <text x="48" y="246" class="mono" font-size="18" fill="#94A3B8">linux · web · tooling</text>
    <text x="48" y="274" class="mono" font-size="15" fill="#475569">// building useful things, one commit at a time</text>
  </g>
</svg>
